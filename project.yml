name: Mynah
options:
  bundleIdPrefix: com.mynah
  deploymentTarget:
    macOS: "26.0"

settings:
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Mynah:
    type: application
    platform: macOS
    sources:
      - path: Mynah
    info:
      path: Mynah/Info.plist
      properties:
        LSUIElement: true
        NSMicrophoneUsageDescription: "Mynah a besoin du micro pour la dictée vocale."
        NSSpeechRecognitionUsageDescription: "Mynah utilise la reconnaissance vocale."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: "https://github.com/emilienrk/mynah/releases/latest/download/appcast.xml"
        SUPublicEDKey: "+BIJxDTK42OgI/4W1HXnyo2OHMDPmswJ4kBAKbppgjQ="
        SUEnableAutomaticChecks: true
    preBuildScripts:
      - name: Generate EngineBuildInfo
        script: |
          "$SRCROOT/scripts/generate-engine-info.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Mynah
        PRODUCT_MODULE_NAME: Mynah
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.7.1"
        CURRENT_PROJECT_VERSION: "111"
        SWIFT_VERSION: 6.0
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "Mynah/Mynah.entitlements"
        ALWAYS_SEARCH_USER_PATHS: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/build-whisper/src"
          - "$(SRCROOT)/build-whisper/ggml/src"
          - "$(SRCROOT)/build-whisper/ggml/src/ggml-metal"
          - "$(SRCROOT)/build-whisper/ggml/src/ggml-blas"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/whisper.cpp/include"
          - "$(SRCROOT)/whisper.cpp/ggml/include"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Mynah/Bridge/WhisperBridge.h"
        OTHER_LDFLAGS:
          - "-L$(SRCROOT)/build-whisper/src"
          - "-L$(SRCROOT)/build-whisper/ggml/src"
          - "-L$(SRCROOT)/build-whisper/ggml/src/ggml-metal"
          - "-L$(SRCROOT)/build-whisper/ggml/src/ggml-blas"
          - "-lwhisper"
          - "-lggml"
          - "-lggml-base"
          - "-lggml-cpu"
          - "-lggml-metal"
          - "-lggml-blas"
          - "-lc++"
          - "-framework Accelerate"
          - "-framework Metal"
          - "-framework Foundation"
          - "-framework AVFoundation"
          - "-framework CoreAudio"
          - "-framework AppKit"
          - "-framework ApplicationServices"
          - "-framework UserNotifications"
          - "-framework ServiceManagement"
    dependencies:
      - package: Sparkle

  MynahTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MynahTests
      # Include only the files under test — app targets don't export Swift modules.
      - path: Mynah/Models
      - path: Mynah/Services/HistoryService.swift
      - path: Mynah/Services/MicrophonePermissionManager.swift
      - path: Mynah/Services/RecordingCoordinator.swift
      - path: Mynah/Services/AudioCaptureService.swift
      - path: Mynah/Services/ClipboardService.swift
      - path: Mynah/Services/WhisperService.swift
      - path: Mynah/Services/HotkeyManager.swift
      - path: Mynah/Services/MediaPlaybackController.swift
      - path: Mynah/Services/AudioProcessProbe.swift
      - path: Mynah/Services/SystemSoundLibrary.swift
      - path: Mynah/Services/NotificationService.swift
      - path: Mynah/Bridge
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: MynahTests
        PRODUCT_MODULE_NAME: MynahTests
        ALWAYS_SEARCH_USER_PATHS: "NO"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/build-whisper/src"
          - "$(SRCROOT)/build-whisper/ggml/src"
          - "$(SRCROOT)/build-whisper/ggml/src/ggml-metal"
          - "$(SRCROOT)/build-whisper/ggml/src/ggml-blas"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/whisper.cpp/include"
          - "$(SRCROOT)/whisper.cpp/ggml/include"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Mynah/Bridge/WhisperBridge.h"
        OTHER_LDFLAGS:
          - "-L$(SRCROOT)/build-whisper/src"
          - "-L$(SRCROOT)/build-whisper/ggml/src"
          - "-L$(SRCROOT)/build-whisper/ggml/src/ggml-metal"
          - "-L$(SRCROOT)/build-whisper/ggml/src/ggml-blas"
          - "-lwhisper"
          - "-lggml"
          - "-lggml-base"
          - "-lggml-cpu"
          - "-lggml-metal"
          - "-lggml-blas"
          - "-lc++"
          - "-framework Accelerate"
          - "-framework Metal"
          - "-framework Foundation"
          - "-framework AVFoundation"
          - "-framework CoreAudio"
          - "-framework AppKit"
          - "-framework ApplicationServices"
          - "-framework UserNotifications"
          - "-framework ServiceManagement"
    dependencies: []
